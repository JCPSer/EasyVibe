[package]
name = "easyvibe-app"
version = "0.2.0"
edition = "2021"

[[bin]]
name = "easyvibe-backend"
path = "src/main.rs"

[build-dependencies]
# 编译期从 scripts/assets.json 派生受管资产表（R12：源码零契约名/env 名字面量）
serde_json.workspace = true

[dependencies]
easyvibe-common.workspace = true
easyvibe-api-types.workspace = true
easyvibe-map.workspace = true
easyvibe-session.workspace = true
easyvibe-db.workspace = true
easyvibe-ai-agent.workspace = true
# 解环：事件出口与运行会话队列状态机（server-api 与 task-engine 各自单向依赖）
easyvibe-event-bus.workspace = true
# c-arch-1：外提的领域模块（git 工作树 / watcher 管线）
easyvibe-git.workspace = true
easyvibe-pipeline.workspace = true
async-trait.workspace = true
axum.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
tower.workspace = true
tower-http.workspace = true
getrandom.workspace = true
# 模型服务"测试连接"端点直连 ping（max_tokens=1）
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# 独立分发形态：编译期内嵌提示词/前端 dist，exe 单文件可双击运行
include_dir = "0.7"
chrono.workspace = true
