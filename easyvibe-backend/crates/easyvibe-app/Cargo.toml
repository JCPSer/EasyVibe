[package]
name = "easyvibe-app"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "easyvibe-backend"
path = "src/main.rs"

[dependencies]
easyvibe-common.workspace = true
easyvibe-api-types.workspace = true
easyvibe-map.workspace = true
easyvibe-session.workspace = true
easyvibe-db.workspace = true
easyvibe-ai-agent.workspace = true
axum.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
tower.workspace = true
tower-http.workspace = true
futures-util = "0.3"
getrandom.workspace = true
# 模型服务"测试连接"端点直连 ping（max_tokens=1）
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# 独立分发形态：编译期内嵌提示词/前端 dist，exe 单文件可双击运行
include_dir = "0.7"
chrono.workspace = true
