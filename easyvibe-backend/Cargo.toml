[workspace]
resolver = "2"
members = [
    "crates/easyvibe-app",
    "crates/easyvibe-map",
    "crates/easyvibe-session",
    "crates/easyvibe-ai-agent",
    "crates/easyvibe-db",
    "crates/easyvibe-api-types",
    "crates/easyvibe-common",
    "crates/easyvibe-event-bus",
    # c-arch-1：从 server-api 外提的领域模块（git 工作树 / watcher 管线）
    "crates/easyvibe-git",
    "crates/easyvibe-pipeline",
]

[workspace.dependencies]
# M2-1 所需
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# QueueHost 对象安全 + Send 的异步 trait 方法（event-bus 与 app 共用）
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs"] }
aes-gcm = "0.10"
getrandom = "0.2"
# 会话旁路表/队列时间戳（UTC，RFC3339 序列化）
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
# 内部 crate
easyvibe-common = { path = "crates/easyvibe-common" }
easyvibe-api-types = { path = "crates/easyvibe-api-types" }
easyvibe-map = { path = "crates/easyvibe-map" }
easyvibe-session = { path = "crates/easyvibe-session" }
easyvibe-ai-agent = { path = "crates/easyvibe-ai-agent" }
easyvibe-db = { path = "crates/easyvibe-db" }
easyvibe-event-bus = { path = "crates/easyvibe-event-bus" }
easyvibe-git = { path = "crates/easyvibe-git" }
easyvibe-pipeline = { path = "crates/easyvibe-pipeline" }
futures-util = "0.3"

[profile.release]
lto = true
