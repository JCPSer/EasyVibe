# 产物副本一致性守卫（R4+R6+R14）：覆盖日常 push/PR，而非只在 tag 打包时。
# 轻量/秒级：纯 python3，不跑 cargo test / npm build / vitest 全量。
# 一个实现（scripts/verify_assets.py），多处薄封装（backend tests/asset_guard.rs、
# renderer archGuard.test.ts、本 workflow、scripts/verify-assets.sh）。
name: Asset Guard

on:
  push:
  pull_request:

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # L1 字节层（本地有副本时）+ L2 名录层：源↔副本 sha256、名录↔源码
      - name: 产物一致性检查（--check）
        run: python3 scripts/verify_assets.py --check

      # R12+R13′ 防回归闸门：受管名 / env 名 / 陈旧名不得出现在名录以外的源码（含注释）；期望 0 命中
      - name: 字面量防回归（--forbid-literals）
        run: python3 scripts/verify_assets.py --forbid-literals

      # T1–T4：生成自愈 / 漂移必红 / 无 manifest 必红 / 同步后必绿（证明 tag 打包不被「缺 manifest」阻断）
      - name: 守卫自检 T1–T4（--selfcheck）
        run: python3 scripts/verify_assets.py --selfcheck

      # 入口 shim 可用性（矩阵 §五命令）
      - name: shim 入口（verify-assets.sh）
        run: bash scripts/verify-assets.sh --check

      # R2 壳边界守卫：桌面壳对前端产物只有「托管」语义，不得有「符号依赖」
      - name: 壳边界守卫（desktop-shell 零前端引用）
        run: python3 scripts/check_shell_boundary.py --check

      - name: 壳边界守卫自检（反例必红自证）
        run: python3 scripts/check_shell_boundary.py --selfcheck

      # R6 地图无环验收：CI 不可见 live map（.easyvibe/ 被 gitignore），改对受版本控制 fixture。
      # fixture 必须与 EXPECT_EDGES 同代（c-arch-1 拆分后的当前快照 = map_post_split.json，16 模块 / 38 边）；
      # 旧快照 map_post_migration.json（14 模块 / 31 边）仅由 --selfcheck 的 H0/H1 负例自证使用。
      - name: 地图无环验收（对受版本控制 fixture）
        run: python3 scripts/verify_map_acyclic.py --check --map scripts/tests/fixtures/map_post_split.json

      - name: 地图无环守卫自检（负例必红）
        run: python3 scripts/verify_map_acyclic.py --selfcheck

      # c-arch-1 边界/领域分离验收：同样不依赖被 gitignore 的 live map
      - name: 边界/领域分离验收（对受版本控制 fixture + 源码文件集）
        run: python3 scripts/verify_arch_split.py --map scripts/tests/fixtures/map_post_split.json

      - name: 边界/领域分离守卫自检（负例必红）
        run: python3 scripts/verify_arch_split.py --selfcheck

      # c-arch-3 组件归属守卫：本仓 CI 不跑 vitest（见本文件头部定位），故归属规则另落一条
      # 纯 python3 判据（FS 层），与本地 archGuard 断言组 7 同源，把「约定」升级为 CI 可见「测试」。
      - name: 组件归属守卫（components 根目录无 *.tsx + 四落点到位）
        run: python3 scripts/check_components_ownership.py --check

      - name: 组件归属守卫自检（反例必红）
        run: python3 scripts/check_components_ownership.py --selfcheck

      # c-arch-3 收口验收：同样不依赖被 gitignore 的 live map（对受版本控制 fixture）
      - name: 组件归属收口验收（对受版本控制 fixture）
        run: python3 scripts/verify_components_ownership.py --map scripts/tests/fixtures/map_post_ownership.json

      - name: 组件归属收口守卫自检（负例必红）
        run: python3 scripts/verify_components_ownership.py --selfcheck

      # c-arch-1 R10③b 地图域守卫：easyvibe-map 的 module_size_guard 是本地权威（cargo test），
      # 本仓 CI 不跑 cargo（见本文件头部定位），故把同一套判据落成纯 python3 载体——
      # 解析 Rust 守卫的常量表（单一事实源）后对 src/ 复判；解析失败即 fail-closed。
      - name: 地图域守卫（easyvibe-map 文件集/LOC/依赖面/符号）
        run: python3 scripts/check_map_domain_guard.py --check

      - name: 地图域守卫自检（负例必红，含解析失败 fail-closed）
        run: python3 scripts/check_map_domain_guard.py --selfcheck

      # c-arch-4 收口验收：REST/WS 传输层收敛「走完另一半」——presentation 业务文件不得绕过
      # src/api/** 直连 fetch。本仓 CI 不跑 vitest（见文件头），故用**原始文本**（不去注释）最严
      # 口径另落一条纯 python3 判据，与本地 archGuard 断言组 5 同源；runtime 为受控网络层出口，
      # 独立登记（scripts/rest_baseline.json，R5 裁定），两组各自键集全等 + 只降不升。
      - name: REST/WS 直连守卫（业务空表 + 网络层登记）
        run: python3 scripts/check_renderer_rest.py --check

      - name: REST/WS 直连守卫自检（负例必红）
        run: python3 scripts/check_renderer_rest.py --selfcheck
