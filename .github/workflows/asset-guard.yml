# 产物副本一致性守卫（R4+R6+R14）：覆盖日常 push/PR，而非只在 tag 打包时。
# 轻量/秒级：纯 python3，不跑 cargo test / npm build / vitest 全量。
# 一个实现（scripts/verify_assets.py），多处薄封装（backend tests/asset_guard.rs、
# renderer archGuard.test.ts、本 workflow、scripts/verify-assets.sh）。
name: Asset Guard

on:
  push:
  pull_request:

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # L1 字节层（本地有副本时）+ L2 名录层：源↔副本 sha256、名录↔源码
      - name: 产物一致性检查（--check）
        run: python3 scripts/verify_assets.py --check

      # R12+R13′ 防回归闸门：受管名 / env 名 / 陈旧名不得出现在名录以外的源码（含注释）；期望 0 命中
      - name: 字面量防回归（--forbid-literals）
        run: python3 scripts/verify_assets.py --forbid-literals

      # T1–T4：生成自愈 / 漂移必红 / 无 manifest 必红 / 同步后必绿（证明 tag 打包不被「缺 manifest」阻断）
      - name: 守卫自检 T1–T4（--selfcheck）
        run: python3 scripts/verify_assets.py --selfcheck

      # 入口 shim 可用性（矩阵 §五命令）
      - name: shim 入口（verify-assets.sh）
        run: bash scripts/verify-assets.sh --check

      # R2 壳边界守卫：桌面壳对前端产物只有「托管」语义，不得有「符号依赖」
      - name: 壳边界守卫（desktop-shell 零前端引用）
        run: python3 scripts/check_shell_boundary.py --check

      - name: 壳边界守卫自检（反例必红自证）
        run: python3 scripts/check_shell_boundary.py --selfcheck

      # R6 地图无环验收：CI 不可见 live map（.easyvibe/ 被 gitignore），改对受版本控制 fixture。
      # fixture 必须与 EXPECT_EDGES 同代（map_post_split.json，22 模块 / 62 边，c-arch-10 服务边界收敛后：
      # 新增装配格 assembly 及其 7 条「装配必需」出边；DV=0、跨层 SCC=0）；
      # 旧快照 map_post_migration.json（14 模块 / 31 边，含受控 DV=1）仅由 --selfcheck 的 H2 负例自证使用；
      # 绿例（H1）改用与 EXPECT_EDGES 同代的 map_post_split.json（DV=0，DV_MAX 归零后的合法全绿样本）。
      - name: 地图无环验收（对受版本控制 fixture）
        run: python3 scripts/verify_map_acyclic.py --check --map scripts/tests/fixtures/map_post_split.json --expect-edges 62

      - name: 地图无环守卫自检（负例必红）
        run: python3 scripts/verify_map_acyclic.py --selfcheck

      # c-arch-1 边界/领域分离验收：同样不依赖被 gitignore 的 live map
      - name: 边界/领域分离验收（对受版本控制 fixture + 源码文件集）
        run: python3 scripts/verify_arch_split.py --map scripts/tests/fixtures/map_post_split.json

      - name: 边界/领域分离守卫自检（负例必红）
        run: python3 scripts/verify_arch_split.py --selfcheck

      # c-arch-3 组件归属守卫：本仓 CI 不跑 vitest（见本文件头部定位），故归属规则另落一条
      # 纯 python3 判据（FS 层），与本地 archGuard 断言组 7 同源，把「约定」升级为 CI 可见「测试」。
      - name: 组件归属守卫（components 根目录无 *.tsx + 四落点到位）
        run: python3 scripts/check_components_ownership.py --check

      - name: 组件归属守卫自检（反例必红）
        run: python3 scripts/check_components_ownership.py --selfcheck

      # c-arch-3 收口验收：同样不依赖被 gitignore 的 live map（对受版本控制 fixture）
      - name: 组件归属收口验收（对受版本控制 fixture）
        run: python3 scripts/verify_components_ownership.py --map scripts/tests/fixtures/map_post_ownership.json

      - name: 组件归属收口守卫自检（负例必红）
        run: python3 scripts/verify_components_ownership.py --selfcheck

      # c-arch-1 R10③b 地图域守卫：easyvibe-map 的 module_size_guard 是本地权威（cargo test），
      # 本仓 CI 不跑 cargo（见本文件头部定位），故把同一套判据落成纯 python3 载体——
      # 解析 Rust 守卫的常量表（单一事实源）后对 src/ 复判；解析失败即 fail-closed。
      - name: 地图域守卫（easyvibe-map 文件集/LOC/依赖面/符号）
        run: python3 scripts/check_map_domain_guard.py --check

      - name: 地图域守卫自检（负例必红，含解析失败 fail-closed）
        run: python3 scripts/check_map_domain_guard.py --selfcheck

      # c-arch-4 收口验收：REST/WS 传输层收敛「走完另一半」——presentation 业务文件不得绕过
      # src/api/** 直连 fetch。本仓 CI 不跑 vitest（见文件头），故用**原始文本**（不去注释）最严
      # 口径另落一条纯 python3 判据，与本地 archGuard 断言组 5 同源；runtime 为受控网络层出口，
      # 独立登记（scripts/rest_baseline.json，R5 裁定），两组各自键集全等 + 只降不升。
      - name: REST/WS 直连守卫（业务空表 + 网络层登记）
        run: python3 scripts/check_renderer_rest.py --check

      - name: REST/WS 直连守卫自检（负例必红）
        run: python3 scripts/check_renderer_rest.py --selfcheck

      # renderer 拆格粒度守卫：防 renderer-core（89 文件 god_module）复发（守卫四套 ↔ 地图四格：runtime/api/shared/ui-kit）。
      # 判据 G0–G4（退役 id 不得回册 / 四格覆盖探针唯一命中 / runtime 与 components/ui 不得同格 /
      # 四格 glob 数上限 / emit_order 中 ui-kit 先于 console-ui）。不依赖 live map，对受版本控制 fixture。
      - name: renderer 粒度守卫（防 god_module 复发）
        run: python3 scripts/check_renderer_granularity.py --check --map scripts/tests/fixtures/map_post_split.json

      - name: renderer 粒度守卫自检（反例必红）
        run: python3 scripts/check_renderer_granularity.py --selfcheck

      # console 侧拆格粒度守卫（c-arch-6 并列子句 / c-console-ui-3）：防 settings 域回并 console-ui、
      # 防新格 settings-ui 再吞装配壳。判据 C0–C3b + C5 窄依赖白名单，N4 真值双向断言。
      # 不依赖 live map，对受版本控制 fixture；settings 回并即红。
      - name: console 粒度守卫（防 settings 回并 / 防再吞壳组件）
        run: python3 scripts/check_console_granularity.py --check --map scripts/tests/fixtures/map_post_split.json

      - name: console 粒度守卫自检（反例必红）
        run: python3 scripts/check_console_granularity.py --selfcheck

      # c-arch-11 / c-renderer-runtime-3：i18n「取词契约 / 词表数据」分离守卫。
      # 判据 P0–P5（旧单文件不得回并＝同形遮蔽 fail-closed / 契约入口 ≤200 行且零词条字面量 /
      # 各分片 ≤1000 行 / 片内 zh=en 且命名空间已登记 / 跨片 key 无重复·命名空间互斥·入口聚合≡分片 /
      # t 签名仍为 key: string）。本仓 CI 不跑 vitest（见文件头），故用纯 python3 载体。
      - name: i18n 分片守卫（契约与词表分离，防地基随翻译膨胀）
        run: python3 scripts/check_i18n_sharding.py --check

      - name: i18n 分片守卫自检（反例必红）
        run: python3 scripts/check_i18n_sharding.py --selfcheck

      # c-arch-5 全新守卫：宿主能力边界（端口 + app-entry 适配模块 + 同层引导入口）。
      # 命题「全库唯一 direction_violation 被结构性消除」的 CI 可见本体——B1 唯一落点 /
      # B2 无逆边（order1/2 不得指向 app-entry）+ DV==0 / B3 加载链无竞态且无反向 import /
      # B4 归属（index.html 归 host-adapter）。本仓 CI 不跑 vitest（见文件头），故用纯 python3 载体。
      - name: 宿主能力边界守卫（c-arch-5，端口化 + DV=0）
        run: python3 scripts/check_host_boundary.py --check --map scripts/tests/fixtures/map_post_split.json

      - name: 宿主能力边界守卫自检（反例必红）
        run: python3 scripts/check_host_boundary.py --selfcheck

      # c-arch-7 / R7 app 层 DB 边界守卫：本仓 CI 不跑 cargo（见文件头定位），故把
      # crates/easyvibe-app/tests/arch_guard.rs 的同套判据落成纯 python3 载体——解析该守卫的
      # 常量表（DB_BANNED / ALIAS_REEXPORT / TASK_ENGINE_PROD / TASK_ENGINE_TEST_EXEMPT /
      # TASK_ENGINE_TEST_BUDGET / ROUTES_REPO_FIELDS）作为单一事实源，用**原始文本**（不去注释）
      # 最严口径对 src/ 复判；任一路径常量解析失败即 fail-closed（绝不静默全绿）。
      - name: app 层 DB 边界守卫（routes/** 与 task_exec 生产不得直连 easyvibe_db）
        run: python3 scripts/check_app_db_boundary.py --check

      - name: app 层 DB 边界守卫自检（负例必红，含解析失败 fail-closed）
        run: python3 scripts/check_app_db_boundary.py --selfcheck

      # c-arch-10 / R7 app 编排层端口化 + 装配格单向守卫：本仓 CI 不跑 cargo，故把
      # crates/easyvibe-app/tests/arch_guard.rs 的同套判据落成纯 python3 载体——解析该守卫的
      # 常量表（SERVICE_DB_RATCHET / SERVICE_BANNED_TYPES / ASSEMBLY_REVERSE）作为单一事实源，
      # 用**原始文本**（不去注释）最严口径对 src/ 复判；常量解析失败即 fail-closed。
      - name: app 编排层端口化守卫（service/** 不得直连 easyvibe_db + 装配格单向）
        run: python3 scripts/check_app_service_boundary.py --check

      - name: app 编排层端口化守卫自检（负例必红，含解析失败 fail-closed）
        run: python3 scripts/check_app_service_boundary.py --selfcheck
